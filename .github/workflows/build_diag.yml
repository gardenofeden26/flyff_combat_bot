name: build-flyff-combat-bot-diag
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source (tag v1.02, pinned commit; window-title fix applied in later step)
        uses: actions/checkout@v4
        with:
          ref: a37c81e231c0a73e743bb14dc55af2ceea4fab9d

      - name: Exclude unused OCR file from vcxproj (dead code in v1.02; tesseract not installed)
        shell: pwsh
        run: |
          $p = 'flyff_combat_bot\flyff_combat_bot.vcxproj'
          (Get-Content $p) | Where-Object { $_ -notmatch 'ClCompile Include="ocr_matching.cpp"' } | Set-Content $p
          if (Select-String -Path $p -Pattern 'ocr_matching.cpp' -Quiet) { throw 'patch failed' }

      - name: Apply window-title + diagnostic patch (files from branch window-title-fix, pinned commit 7ba4e4a)
        shell: pwsh
        run: |
          $base = 'https://raw.githubusercontent.com/gardenofeden26/flyff_combat_bot/7ba4e4a03f053c5195ee78bed48922430912d573/flyff_combat_bot'
          $map = [ordered]@{
            '1-game_window.cpp' = 'game_window.cpp'
            '2-game_window.h' = 'game_window.h'
            '1-diag1-memory_reader.cpp' = 'memory_reader.cpp'
            '4-mouse_and_keyboard.cpp' = 'mouse_and_keyboard.cpp'
            '2-diag5-main.cpp' = 'main.cpp'
            '6-map_image_matching.cpp' = 'map_image_matching.cpp'
            '7-debug_image_matching.cpp' = 'debug_image_matching.cpp'
            '8-image_matching.cpp' = 'image_matching.cpp'
          }
          foreach ($k in $map.Keys) {
            Invoke-WebRequest -Uri "$base/$k" -OutFile "flyff_combat_bot\$($map[$k])"
          }
          $newHits = (Get-ChildItem 'flyff_combat_bot\*.cpp','flyff_combat_bot\*.h' | Select-String -Pattern 'find_flyff_window').Count
          if ($newHits -lt 20) { throw "window-title fix not applied, only $newHits find_flyff_window references" }
          $oldHits = (Get-ChildItem 'flyff_combat_bot\*.cpp' | Select-String -Pattern 'FindWindowW\(NULL, L\"Flyff Universe').Count
          if ($oldHits -gt 0) { throw "old exact-title lookups remain: $oldHits" }
          $diagHits = (Select-String -Path 'flyff_combat_bot\memory_reader.cpp' -Pattern 'DIAG_BUILD_ANGLE_SCAN_V1').Count
          if ($diagHits -lt 2) { throw "diagnostic patch not applied, only $diagHits DIAG_BUILD_ANGLE_SCAN_V1 markers" }
          $oldErrHits = (Select-String -Path 'flyff_combat_bot\memory_reader.cpp' -Pattern 'Unable to assign check_bytes_after_angle').Count
          if ($oldErrHits -gt 0) { throw "old misleading angle error still present: $oldErrHits" }
          $candHits = (Select-String -Path 'flyff_combat_bot\memory_reader.cpp' -Pattern 'DIAG_CANDIDATE_FINDER_V1').Count
          if ($candHits -lt 2) { throw "candidate-finder patch not applied, only $candHits DIAG_CANDIDATE_FINDER_V1 markers" }
          $candMain = (Select-String -Path 'flyff_combat_bot\main.cpp' -Pattern 'run_candidate_finder').Count
          if ($candMain -lt 1) { throw "candidate-finder entry hook missing in main.cpp" }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install OpenCV 4.7.0 to C:\opencv (hash-verified)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/opencv/opencv/releases/download/4.7.0/opencv-4.7.0-windows.exe -OutFile opencv.exe
          $h = (Get-FileHash .\opencv.exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne '7fab7be68a4ab7f1b70759b0e58d4c4ffc2b8aee72642df6f2dfcc6c161b2465') { throw "OpenCV SHA256 mismatch: $h" }
          Start-Process -FilePath .\opencv.exe -ArgumentList '-o"C:\" -y' -Wait
          if (!(Test-Path 'C:\opencv\build\x64\vc16\lib\opencv_world470.lib')) { throw 'OpenCV extraction failed' }

      - name: Fetch Dear ImGui v1.90.4 into project
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/ocornut/imgui/archive/refs/tags/v1.90.4.zip -OutFile imgui.zip
          Expand-Archive .\imgui.zip -DestinationPath .
          New-Item -ItemType Directory -Force -Path 'flyff_combat_bot\imgui' | Out-Null
          Copy-Item -Recurse -Force 'imgui-1.90.4\*' 'flyff_combat_bot\imgui\'
          if (!(Test-Path 'flyff_combat_bot\imgui\backends\imgui_impl_dx12.cpp')) { throw 'imgui placement failed' }

      - name: Build Release x64
        shell: pwsh
        run: msbuild flyff_combat_bot.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Package runnable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item 'x64\Release\flyff_combat_bot.exe' package\
          Copy-Item 'C:\opencv\build\x64\vc16\bin\opencv_world470.dll' package\
          Copy-Item -Recurse 'flyff_combat_bot\images' package\images
          Copy-Item 'flyff_combat_bot\flyffcombat.cfg','flyff_combat_bot\eng.traineddata','flyff_combat_bot\imgui.ini' package\
          Get-ChildItem -Recurse package | Select-Object Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flyff_combat_bot_candidate_finder_readonly
          path: package\
